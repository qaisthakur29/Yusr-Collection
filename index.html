    <!-- Meta Pixel no-JS fallback. An <img> inside <noscript> is invalid in <head>,
         so it lives here at the top of <body> instead. -->
    <noscript>
      <img height="1" width="1" style="display:none"
        src="https://www.facebook.com/tr?id=1906601310515391&ev=PageView&noscript=1"
        alt="" />
    </noscript>
    <div id="root"><!-- Static H1 for crawlers. The SPA renders its hero as an image
      with no heading, so without this the raw HTML would ship no H1 at all. React
      only clears a root container's children during a View Transition (the
      Snapshot flag), so this node survives the client render. Inline styles rather
      than a utility class: the raw HTML has to be self-contained for crawlers that
      never load the CSS bundle. -->
      <h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Premium Islamic Streetwear for the Believers</h1>
